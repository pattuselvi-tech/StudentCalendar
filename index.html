<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ambient background -->
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>

    <main class="calendar">
        <!-- desk-calendar binding rings -->
        <span class="ring ring-left" aria-hidden="true"></span>
        <span class="ring ring-right" aria-hidden="true"></span>

        <div class="quote-card">
            <small>✨ Quote of the day</small>
            <p id="quote-text"></p>
        </div>

        <header class="calendar-header">
            <button id="prev" type="button" aria-label="Previous month">&#8249;</button>
            <div class="title-block">
                <h2 id="month-title"></h2>
                <span id="year-title"></span>
            </div>
            <button id="next" type="button" aria-label="Next month">&#8250;</button>
        </header>

        <div class="toolbar">
            <button id="today-btn" type="button">Jump to today</button>
            <button id="voice-btn" class="mic-btn" type="button" aria-label="Voice commands" title="Voice commands">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2Z"/></svg>
                <span>Voice</span>
            </button>
            <div class="legend">
                <span><i class="dot dot-college"></i>College</span>
                <span><i class="dot dot-personal"></i>Personal</span>
            </div>
        </div>

        <!-- shows while listening -->
        <div class="listening" id="listening" hidden>
            <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
            <p id="listening-text">Listening...</p>
        </div>

        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="grid-wrap">
            <div class="days" id="days"></div>
        </div>

        <section class="event-panel">
            <div class="panel-head">
                <h3 id="selected-date">Select a date</h3>
                <span id="event-count" hidden></span>
            </div>
            <ul id="event-list"></ul>
            <div class="add-row">
                <input type="text" id="event-input" placeholder="Add an event" maxlength="60" autocomplete="off">
                <button id="dictate-btn" class="mic-btn mic-round" type="button" aria-label="Speak an event" title="Speak an event">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2Z"/></svg>
                </button>
                <button id="add-event" type="button">Add</button>
            </div>
            <p class="voice-help" id="voice-help">Try saying: "next month", "go to 25 October", "add event revise notes on 2 November"</p>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
